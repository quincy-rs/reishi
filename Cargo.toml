[workspace]
members = [
    "reishi-handshake",
    "reishi-quinn",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
authors = ["Jakub Kubík <jakub.kubik.it@protonmail.com>"]
edition = "2024"
license = "MIT"
rust-version = "1.85"
homepage = "https://github.com/quincy-rs/reishi"
repository = "https://github.com/quincy-rs/reishi"
keywords = ["noise", "handshake", "cryptography", "quinn", "quic"]
categories = ["cryptography", "network-programming"]

[workspace.dependencies]
# Internal crates
reishi-handshake = { path = "reishi-handshake", version = "0.4.0" }

# Cryptography
aws-lc-rs = { version = "1.19", default-features = false, features = ["non-fips"] }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["zeroize_derive", "alloc"] }

# Quinn
quinn-proto = { version = "0.11", default-features = false }

# Utils
bytes = "1"
